name: Build, Publish and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ValheimModManager.slnx -r ${{ matrix.runtime }} --verbosity normal

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          if ($env:GITHUB_REF_NAME) {
            ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Configuration Release -Version $env:GITHUB_REF_NAME
          } else {
            ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Configuration Release
          }

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/publish.sh
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            ./scripts/publish.sh -r ${{ matrix.runtime }} -c Release -v "${GITHUB_REF_NAME}"
          else
            ./scripts/publish.sh -r ${{ matrix.runtime }} -c Release
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.runtime }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all published artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract Changelog Entry
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Extracting release notes for version $VERSION from CHANGELOG.md"
          if [ -f CHANGELOG.md ]; then
            python3 -c "import sys, re; ver = sys.argv[1]; content = open('CHANGELOG.md', 'r', encoding='utf-8').read(); pattern = rf'## \[?{re.escape(ver)}\]?.*?\n(.*?)(?=\n## |\Z)'; match = re.search(pattern, content, re.DOTALL); open('release_notes.md', 'w', encoding='utf-8').write(match.group(1).strip() if match else '')" "$VERSION"
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release v$VERSION" > release_notes.md
          fi

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
